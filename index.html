<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Workload and Timetable Management System | Apex ERP Portal</title>
  <meta name="description" content="Centralized academic workload, curriculum planning, room occupancy, and clash-free timetable management system.">
  
  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  
  <!-- Chart.js CDN for Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Application Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/timetable.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <div id="app">
    <!-- LEFT SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">A</div>
        <div class="brand-text">
          <h2>Apex Institute</h2>
          <p>Academic ERP Portal</p>
        </div>
      </div>

      <!-- Navigation Links Container -->
      <nav class="sidebar-menu" id="sidebarMenu">
        <!-- Rendered dynamically by app.js based on active user role -->
      </nav>

      <!-- Sidebar Footer -->
      <div class="sidebar-footer">
        <div class="semester-badge">
          <span class="live-dot"></span>
          <div>
            <div style="font-weight: 700; color: #fff;">Fall 2026 Active</div>
            <div style="font-size: 0.7rem; opacity: 0.8;">DBMS Edition v1.2</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- MAIN WRAPPER -->
    <div class="main-wrapper">
      <!-- TOP HEADER -->
      <header class="top-header">
        <div class="header-left">
          <button class="mobile-menu-btn" onclick="window.app.toggleSidebar()" aria-label="Toggle Navigation">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>

          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input 
              type="text" 
              class="search-input" 
              id="globalSearchInput" 
              placeholder="Search faculty, course code, room (e.g. DBMS, Rao, A-101)..." 
              onkeydown="if(event.key === 'Enter') window.app.handleGlobalSearch(this.value)"
            >
          </div>
        </div>

        <div class="header-right">
          <!-- Role Selector -->
          <div class="role-switcher-box">
            <span class="role-switcher-label">Role:</span>
            <select class="role-select" id="roleSelect" onchange="window.store.setRole(this.value)">
              <option value="admin">Admin (Dean)</option>
              <option value="coordinator">Coordinator (CSE)</option>
              <option value="faculty">Faculty (Dr. Rao)</option>
            </select>
          </div>

          <!-- Theme Toggle -->
          <button class="header-action-btn" onclick="window.store.toggleTheme()" title="Toggle Light / Dark Mode">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>

          <!-- Notifications Bell -->
          <button class="header-action-btn" onclick="window.store.setView('notifications')" title="Notifications">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            <span class="header-badge-count" id="headerNotifCount">2</span>
          </button>

          <!-- Profile Badge -->
          <div class="user-profile" onclick="window.store.setView('settings')">
            <img src="" id="headerAvatar" class="user-avatar" alt="User Profile">
            <div class="user-info">
              <span class="user-name" id="headerName">Loading...</span>
              <span class="user-role-badge" id="headerRole">Portal User</span>
            </div>
          </div>
        </div>
      </header>

      <!-- DYNAMIC VIEW CONTAINER -->
      <main class="view-container" id="view-content">
        <!-- Rendered dynamically by active view component -->
      </main>
    </div>
  </div>

  <!-- GLOBAL MODAL BACKDROP -->
  <div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target === this) window.app.closeModal()">
    <div class="modal-container">
      <div class="modal-header">
        <h3 id="modalTitle">Modal Title</h3>
        <button class="modal-close-btn" onclick="window.app.closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- Dynamic modal form -->
      </div>
      <div class="modal-footer" id="modalFooter">
        <!-- Dynamic modal buttons -->
      </div>
    </div>
  </div>

  <!-- TOAST CONTAINER -->
  <div id="toast-container"></div>

  <!-- APPLICATION SCRIPTS -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  
  <!-- Views -->
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/faculty.js"></script>
  <script src="js/views/subjects.js"></script>
  <script src="js/views/workload.js"></script>
  <script src="js/views/timetable.js"></script>
  <script src="js/views/rooms.js"></script>
  <script src="js/views/departments.js"></script>
  <script src="js/views/reports.js"></script>
  <script src="js/views/notifications.js"></script>
  <script src="js/views/schema.js"></script>
  <script src="js/views/settings.js"></script>

  <!-- App Main -->
  <script src="js/app.js"></script>
</body>
</html>
